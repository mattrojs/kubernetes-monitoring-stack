apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app
  namespace: appmonitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
      - name: mi-app
        image: docker.io/library/app-py:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        - containerPort: 8000
