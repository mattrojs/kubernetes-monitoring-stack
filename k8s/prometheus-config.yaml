apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: appmonitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'mi-app'
        static_configs:
          - targets: ['mi-app:8000']